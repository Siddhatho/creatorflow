{% extends "base.html" %}
{% block content %}
<div class="p-6">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">Campaigns</h1>
    <a href="{% url 'workflow:campaign_create' %}" class="bg-blue-600 text-white px-4 py-2 rounded">+ New Campaign</a>
  </div>
  {% for c in campaigns %}
  <div class="border rounded p-4 mb-3 flex justify-between items-center">
    <div>
      <p class="font-semibold">{{ c.name }}</p>
      <p class="text-sm text-gray-500">{{ c.start_date }} → {{ c.end_date }}</p>
      <p class="text-sm text-gray-400">Platforms: {{ c.platforms.all|join:", " }}</p>
    </div>
    <div class="flex gap-2">
      <a href="{% url 'workflow:campaign_detail' c.pk %}" class="text-blue-500 text-sm">View</a>
      <a href="{% url 'workflow:campaign_edit' c.pk %}" class="text-yellow-500 text-sm">Edit</a>
    </div>
  </div>
  {% empty %}
  <p class="text-gray-400">No campaigns yet.</p>
  {% endfor %}
</div>
{% endblock %}
