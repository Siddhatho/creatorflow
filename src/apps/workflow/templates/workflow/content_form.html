{% extends "base.html" %}
{% block content %}
<div class="p-6 max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold mb-4">{{ action }} Content</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded mt-4">Save</button>
  </form>
</div>
{% endblock %}
